name: Bus Timer checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Dashboard Actions: both jobs are checks only; neither builds or deploys.
env:
  BW_ACTION_TYPE: test

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
