name: build_web_release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'server/web/**'
      - '.github/workflows/build_web_release.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build web
        env:
          WEB_BASE_HREF: ${{ vars.WEB_BASE_HREF || '/' }}
          BUS_API_URL: ${{ vars.BUS_API_URL || 'https://bustimer.bluewaikiki.top' }}
        run: flutter build web --release --base-href "$WEB_BASE_HREF" --dart-define="BUS_API_URL=$BUS_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: build_web_release
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
